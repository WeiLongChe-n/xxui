name: publish

# 触发方式：
#   1. 推版本 tag（v0.3.0）→ 自动发布
#   2. 手动触发（Actions 页面 Run workflow），可指定 dist-tag
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist-tag:
        description: '发布到哪个 dist-tag'
        required: false
        default: latest
        type: choice
        options:
          - latest
          - beta
          - next

# Trusted Publishing 靠 OIDC 换临时凭证，必须给 id-token: write
permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 准备 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 升级 npm
        run: |
          # Trusted Publishing 要求 npm >= 11.5.1、Node >= 22.14
          npm install -g npm@latest
          node --version
          npm --version

      - name: 配置 registry（OIDC 前提）
        run: |
          # npm 只会对「有 registry 条目、但没有 _authToken」的环境发起 OIDC 换取。
          # 只要存在任何 _authToken（哪怕是空串或占位符 XXXXX-XXXXX），
          # npm 就认为已登录，直接跳过 OIDC，报 ENEEDAUTH。
          npm config set registry https://registry.npmjs.org/
          npm config delete //registry.npmjs.org/:_authToken 2>/dev/null || true
          echo "registry = $(npm config get registry)"
          echo "npm     = $(npm --version)"
          if [ -n "$ACTIONS_ID_TOKEN_REQUEST_URL" ]; then
            echo "OIDC 环境变量已注入 ✓"
          else
            echo "::error::缺少 ACTIONS_ID_TOKEN_REQUEST_URL，检查 permissions: id-token: write"
            exit 1
          fi
          if npm config get //registry.npmjs.org/:_authToken >/dev/null 2>&1; then
            echo "::warning::检测到残留 _authToken，可能阻断 OIDC"
          fi

      - name: 安装依赖
        run: npm ci

      - name: 校验 tag 与版本号一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "require('./packages/mobile-ui/package.json').version")
          echo "tag=$TAG  package.json=$PKG"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag $TAG 与 packages/mobile-ui/package.json 的版本 $PKG 不一致"
            exit 1
          fi

      - name: 类型检查
        run: npm run typecheck

      - name: 构建
        run: npm run build

      - name: 校验构建产物
        run: |
          for f in xxui.mjs xxui.umd.js xxui.css types/index.d.ts; do
            if [ ! -f "packages/mobile-ui/dist/$f" ]; then
              echo "::error::缺少产物 dist/$f"
              exit 1
            fi
          done
          ls -lh packages/mobile-ui/dist

      - name: 检查该版本是否已发布
        id: check
        run: |
          VER=$(node -p "require('./packages/mobile-ui/package.json').version")
          if npm view "xxui-mobile@$VER" version --registry https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "::notice::xxui-mobile@$VER 已存在于 npm，跳过发布（不会覆盖已发布版本）"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: 发布到 npm
        if: steps.check.outputs.exists == 'false'
        run: |
          # 必须写 ./ 前缀：npm 会把 packages/mobile-ui 当成 GitHub 的 owner/repo 简写去 ls-remote
          # 不传 --otp、不传 token、也不传 --registry：registry 由上一步写入 .npmrc，
          # npm 才会把它当作「可做 OIDC 交换的注册源」。
          npm publish ./packages/mobile-ui \
            --tag "${{ inputs.dist-tag || 'latest' }}"

      - name: 输出结果
        run: |
          VER=$(node -p "require('./packages/mobile-ui/package.json').version")
          if [ "${{ steps.check.outputs.exists }}" = "true" ]; then
            echo "### xxui-mobile@$VER 已存在，本次跳过发布" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### 已发布 xxui-mobile@$VER" >> "$GITHUB_STEP_SUMMARY"
            echo "https://www.npmjs.com/package/xxui-mobile/v/$VER" >> "$GITHUB_STEP_SUMMARY"
          fi
